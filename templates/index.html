{% extends "layout.html" %} {% block content %}
<h1>Register</h1>
<form action="/register" method="post">
  <input
    autofocus
    autocomplete="off"
    type="text"
    name="name"
    placeholder="Name"
  />
  <select name="sport">
    <option selected value="">Sport</option>
    {%for sport in sports%}
    <option value="{{sport}}">{{sport}}</option>
    {%endfor%}
  </select>
  <button type="submit">Register</button>
</form>
<a href="/reg1">Registered</a>
{% endblock %}
